<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>Segoe UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Black</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <match target="pattern"><test name="family"><string>Arial Black</string></test><edit name="weight" mode="assign"><const>bold</const></edit></match>
</fontconfig>
